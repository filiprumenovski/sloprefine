name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check .
      - name: dogfood (the docs must pass their own linter)
        run: slopcheck README.md CONTRIBUTING.md --no-color
      - name: voiceprint smoke test
        run: |
          slopcheck voice build corpus -o /tmp/voice.json || true
          slopcheck rules
