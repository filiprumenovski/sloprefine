[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sloprefine"
version = "1.6.3"
description = "A slop refinery: crude prose in, fewer machine-writing markers out."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Filip Rumenovski", email = "frumenovski@gmail.com" }]
maintainers = [{ name = "Filip Rumenovski" }]
keywords = ["writing", "linter", "llm", "style", "prose", "agents", "evals"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/filiprumenovski/sloprefine"
Repository = "https://github.com/filiprumenovski/sloprefine"
Issues = "https://github.com/filiprumenovski/sloprefine/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
lm = ["transformers>=4.40", "torch>=2.0"]
mcp = ["mcp>=2.0"]

[project.scripts]
sloprefine = "sloprefine.cli:main"
sloprefine-mcp = "sloprefine.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sloprefine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
