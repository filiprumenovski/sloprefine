[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slopcheck"
version = "0.2.0"
description = "Lint prose against published AI-writing tells."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Filip Rumenovski" }]
keywords = ["writing", "linter", "llm", "style", "prose"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
lm = ["transformers>=4.40", "torch>=2.0"]

[project.scripts]
slopcheck = "slopcheck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/slopcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
