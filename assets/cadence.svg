<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 80 880 212" width="880" height="212" role="img" aria-labelledby="ct cd">
<title id="ct">Cadence of the two corpus controls</title>
<desc id="cd">Each bar is one sentence, its height the word count. The choppy control is twenty short bars; the clean control is ten bars of widely varying length.</desc>
<style>
  text  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .rl   { font-size:13px; fill:#6e7781; }
  .rs   { font-size:10px; fill:#9198a1; }
  .cap  { font-size:10px; fill:#9198a1; font-style:italic; }
  .axis { stroke:#9198a1; stroke-width:1.2; }
  .hot  { fill:#bf6a45; fill-opacity:.85; }
  .cool { fill:#4a9c7d; fill-opacity:.85; }
  @media (prefers-color-scheme:dark){
    .rl{ fill:#adbac7; } .rs,.cap{ fill:#7d8590; } .axis{ stroke:#7d8590; }
    .hot{ fill:#e08a5f; } .cool{ fill:#56bf95; }
  }
</style>
<text class="rl" x="24" y="98">choppy_control</text>
<text class="rs" x="24" y="114">punch 1.00  punchy  (20 sentences)</text>
