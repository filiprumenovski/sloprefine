<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420" role="img" aria-labelledby="wt wd">
<title id="wt">Wanted poster for the em dash</title>
<desc id="wd">A mock wanted poster charging the em dash with impersonating a pause, noting that the rule is only medium severity and is off by default for fiction.</desc>
<style>
  .edge { fill:none; stroke:#6e7781; stroke-width:2.4; }
  .hair { fill:none; stroke:#9198a1; stroke-width:1; }
  .card { fill:#6e7781; fill-opacity:.05; }
  .slab { font-family:Georgia,'Times New Roman',serif; font-weight:700;
          fill:#6e7781; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
          fill:#9198a1; }
  .perp { fill:#bf6a45; }
  .fine { font-style:italic; }
  @media (prefers-color-scheme:dark){
    .edge{ stroke:#adbac7; } .hair{ stroke:#7d8590; }
    .card{ fill:#ffffff; fill-opacity:.06; }
    .slab{ fill:#e6edf3; } .mono{ fill:#7d8590; } .perp{ fill:#e08a5f; }
  }
</style>

<rect class="card" x="6" y="6" width="308" height="408" rx="4"/>
<rect class="edge" x="6" y="6" width="308" height="408" rx="4"/>
<rect class="hair" x="15" y="15" width="290" height="390" rx="2"/>

<text class="slab" x="160" y="74" font-size="46" text-anchor="middle"
      letter-spacing="4">WANTED</text>
<path class="hair" d="M44 90 H276"/>
<text class="mono" x="160" y="108" font-size="10" text-anchor="middle"
      letter-spacing="2.5">FOR CRIMES AGAINST CADENCE</text>

<!-- the portrait: one very large em dash -->
<rect class="hair" x="72" y="126" width="176" height="104"/>
<rect class="perp" x="100" y="172" width="120" height="11" rx="2"/>

<text class="slab" x="160" y="258" font-size="22" text-anchor="middle"
      letter-spacing="2">THE EM DASH</text>
<text class="mono" x="160" y="276" font-size="10" text-anchor="middle">
  alias: the dramatic pause
</text>

<path class="hair" d="M44 292 H276"/>
<g class="mono" font-size="11">
  <text x="44" y="314">charge . . . impersonating a comma</text>
  <text x="44" y="332">also . . . . . loitering in clauses</text>
  <text x="44" y="350">reward . . . . one (1) semicolon</text>
</g>
<path class="hair" d="M44 364 H276"/>

<text class="mono fine" x="160" y="382" font-size="9" text-anchor="middle">
  severity: medium. the rule is off by default
</text>
<text class="mono fine" x="160" y="396" font-size="9" text-anchor="middle">
  for fiction, where it was never guilty
</text>
</svg>
